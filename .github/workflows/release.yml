name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches versionName and secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.MAIGO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAIGO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAIGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAIGO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          expected_tag="v${version_name}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/build.gradle.kts versionName (${expected_tag})."
            exit 1
          fi
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret MAIGO_${var}."
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          MAIGO_KEYSTORE_BASE64: ${{ secrets.MAIGO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$MAIGO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maigo-release.jks"
          chmod 600 "$RUNNER_TEMP/maigo-release.jks"

      - name: Run quality checks and Tier 1 & Tier 2 tests
        run: ./gradlew ktlintCheck detekt lintDebug :core:model:test :core:common:test :core:testing:test testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble signed release APK
        env:
          MAIGO_KEYSTORE_PATH: ${{ runner.temp }}/maigo-release.jks
          MAIGO_KEYSTORE_PASSWORD: ${{ secrets.MAIGO_KEYSTORE_PASSWORD }}
          MAIGO_KEY_ALIAS: ${{ secrets.MAIGO_KEY_ALIAS }}
          MAIGO_KEY_PASSWORD: ${{ secrets.MAIGO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/maigo-release.jks"

      - name: Verify APK signature and generate SHA-256
        run: |
          set -euo pipefail
          apk_source="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk_source" ]; then
            echo "::error::Expected signed APK at ${apk_source} was not produced."
            exit 1
          fi
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$apksigner_bin" verify --verbose "$apk_source"
          mkdir -p dist
          apk_target="dist/maigo-${GITHUB_REF_NAME}.apk"
          cp "$apk_source" "$apk_target"
          (cd dist && sha256sum "maigo-${GITHUB_REF_NAME}.apk" > "maigo-${GITHUB_REF_NAME}.apk.sha256")

      - name: Generate release notes
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          sha256_line = pathlib.Path(f"dist/maigo-{tag}.apk.sha256").read_text(encoding="utf-8").strip()

          def run_git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          prev_tags = [
              t for t in run_git("tag", "--sort=-v:refname", "--merged", tag).splitlines()
              if t and t != tag
          ]
          prev_tag = prev_tags[0] if prev_tags else None
          rev_range = f"{prev_tag}..{tag}" if prev_tag else tag

          code_types = {"feat", "fix", "refactor", "perf"}
          commit_re = re.compile(r"^([a-z]+)(?:\([^)]+\))?!?:\s+.+$")
          raw_commits = run_git("log", "--no-merges", "--format=%s", rev_range).splitlines()

          changes = []
          for subject in raw_commits:
              subject = subject.strip()
              m = commit_re.match(subject)
              if m and m.group(1) in code_types:
                  changes.append(f"- {subject}")

          lines = [f"## Maigo {tag}", ""]
          if changes:
              lines.extend(["### Changes", "", *changes])
          else:
              lines.append("Maintenance release.")

          lines.extend([
              "",
              "### Verification",
              "",
              "```text",
              sha256_line,
              "```",
          ])

          if prev_tag:
              lines.extend([
                  "",
                  f"**Full Changelog**: {server_url}/{repo}/compare/{prev_tag}...{tag}",
              ])
          else:
              lines.extend([
                  "",
                  f"**Full Changelog**: {server_url}/{repo}/commits/{tag}",
              ])

          pathlib.Path("dist/release-notes.md").write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/maigo-${GITHUB_REF_NAME}.apk" \
            "dist/maigo-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Maigo ${GITHUB_REF_NAME}" \
            --notes-file "dist/release-notes.md"
